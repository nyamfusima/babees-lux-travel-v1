<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17372e" />

    <title>Babee’s Lux Travel: four days in Mozambique</title>
    <meta
      name="description"
      content="Four days between Maputo and Bilene with Babee’s Lux Travel. R6 900 per person, including road transfer from Johannesburg, daily breakfast and a Maputo city tour. Enquire on WhatsApp."
    />

    <!--
      Link previews (WhatsApp, Facebook, LinkedIn, iMessage, Slack).

      og:image MUST be an absolute https URL. WhatsApp does not resolve a
      relative path, so a relative og:image is why no picture appears when the
      link is pasted into a chat.

      IF THE SITE MOVES TO A CUSTOM DOMAIN, change the four absolute URLs
      below to the new domain. They are the only hard-coded URLs in the project.

      og-image.jpg is 1200x630 (the ratio these scrapers expect) and 35 KB.
      WhatsApp silently drops preview images much over ~300 KB, so keep any
      replacement small.
    -->
    <link rel="canonical" href="https://babees-lux-travel-v1.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Babee’s Lux Travel" />
    <meta property="og:locale" content="en_ZA" />
    <meta property="og:url" content="https://babees-lux-travel-v1.vercel.app/" />
    <meta property="og:title" content="Babee’s Lux Travel: four days in Mozambique" />
    <meta
      property="og:description"
      content="From the streets of Maputo to the clear waters of Bilene. Four days from Johannesburg, R6 900 per person. Enquire on WhatsApp."
    />
    <meta
      property="og:image"
      content="https://babees-lux-travel-v1.vercel.app/assets/img/og-image.jpg"
    />
    <meta
      property="og:image:secure_url"
      content="https://babees-lux-travel-v1.vercel.app/assets/img/og-image.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A traditional dhow moored in turquoise water beside a white sandbar."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Babee’s Lux Travel: four days in Mozambique" />
    <meta
      name="twitter:description"
      content="From the streets of Maputo to the clear waters of Bilene. Four days from Johannesburg, R6 900 per person."
    />
    <meta
      name="twitter:image"
      content="https://babees-lux-travel-v1.vercel.app/assets/img/og-image.jpg"
    />

    <!-- Typographic wordmark as the tab icon; no raster favicon file to manage. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2317372e'/%3E%3Ctext x='16' y='23' font-family='Didot,Bodoni MT,Times New Roman,serif' font-size='21' fill='%23f7f5ef' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Bodoni Moda  — display face, standing in for the reference site's
                     Questa Grande (Adobe Fonts, not licensable here).
      Archivo      — text face, standing in for Apparat Light (Fatype).
      Both are SIL Open Font License via Google Fonts.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@300..500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..500;1,6..96,400..500&display=swap"
    />

    <!-- The hero still is the largest paint on the page; start it early. -->
    <link
      rel="preload"
      as="image"
      href="/assets/img/hero-dhow-sandbar-1600.jpg"
      imagesrcset="/assets/img/hero-dhow-sandbar-800.jpg 800w, /assets/img/hero-dhow-sandbar-1600.jpg 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
