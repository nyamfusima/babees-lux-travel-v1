    <title>Babee’s Lux Travel — coastal journeys planned from South Africa</title>
    <meta
      name="description"

    <!-- Typographic wordmark as the tab icon; no raster favicon file to manage. -->

      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2317372e'/%3E%3Ctext x='16' y='23' font-family='Didot,Bodoni MT,Times New Roman,serif' font-size='21' fill='%23f7f5ef' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Bodoni Moda  — display face, standing in for the reference site's
                     Questa Grande (Adobe Fonts, not licensable here).
      Archivo      — text face, standing in for Apparat Light (Fatype).
      Both are SIL Open Font License via Google Fonts.
    -->

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@300..500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..500;1,6..96,400..500&display=swap"
    />

    <!-- The hero still is the largest paint on the page; start it early. -->
    <link
      rel="preload"
      as="image"
      href="/assets/img/hero-coast-lodge-1600.jpg"
      imagesrcset="/assets/img/hero-coast-lodge-800.jpg 800w, /assets/img/hero-coast-lodge-1600.jpg 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
  </head>
